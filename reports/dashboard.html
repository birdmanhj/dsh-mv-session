<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sup-src-hash" content="8f32d6c412d3017d">
<title>通用项目监理 · 仪表台 / Project Supervisor Dashboard</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --line:#e4e4e7; --ink:#18181b; --muted:#71717a;
    --l4:#c62828; --l3:#ea580c; --l2:#ca8a04; --l1:#1d4ed8;
    --ok:#15803d; --warn:#ca8a04; --bad:#c62828;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;
         display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12px}
  .grow{flex:1}
  button.lang{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;
              cursor:pointer;font-size:12px;color:var(--ink)}
  button.lang:hover{background:#f4f4f5}
  main{padding:18px 22px 60px;max-width:1280px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:15px}
  section h2{font-size:14px;margin:0 0 12px;font-weight:650;display:flex;align-items:center;gap:8px}
  section h2 .tag{font-size:11px;color:var(--muted);font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid #f1f1f3;vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  code{background:#f4f4f5;padding:1px 5px;border-radius:4px;font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;color:#fff;white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .tree{list-style:none;margin:0;padding-left:0}
  .tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed var(--line)}
  .tree li{padding:5px 0 5px 6px;position:relative}
  .node{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .fitnum{font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .bar{height:7px;border-radius:4px;background:#f1f1f3;overflow:hidden;min-width:58px}
  .bar>i{display:block;height:100%}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
  .kpi{border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .kpi .k{color:var(--muted);font-size:11px}
  .kpi .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .stop{border-left:3px solid var(--l2);padding:7px 11px;background:#fffbeb;border-radius:0 7px 7px 0;margin-bottom:7px}
  .gap{border-left:3px solid var(--muted);padding:5px 10px;background:#fafafa;border-radius:0 6px 6px 0;
       margin-bottom:5px;font-size:12.5px;color:#3f3f46}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:#fff;font-size:12px}
  /* 宽表格（六维 × 多版本、版本矩阵）会横向出界。
     出界的后果是整页被撑宽、右侧列看不到 —— 给容器加横向滚动条，
     溢出只发生在容器内部。表头 sticky 让滚动时仍能对上列。 */
  .scrollx{overflow-x:auto;overflow-y:hidden;padding-bottom:4px;max-width:100%}
  .scrollx table{min-width:100%}
  .scrollx::-webkit-scrollbar{height:9px}
  .scrollx::-webkit-scrollbar-thumb{background:#c4c4c8;border-radius:5px}
  .scrollx::-webkit-scrollbar-track{background:#f1f1f3;border-radius:5px}
  /* ── 项目标签页 ── */
  .tabs{display:flex;gap:2px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-bottom:none;
       border-radius:8px 8px 0 0;background:#f7f7f8;cursor:pointer;font-size:12.5px;max-width:260px;
       position:relative;top:1px;user-select:none}
  .tab:hover{background:#efeff1}
  .tab.on{background:#fff;font-weight:600;box-shadow:0 -2px 0 0 var(--l2) inset}
  .tab .tabn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab .tabx{color:#a1a1aa;font-size:14px;line-height:1;padding:0 1px;border-radius:4px}
  .tab .tabx:hover{color:#fff;background:#c62828}
  /* 「+」与项目标签【同高】：此前单独给了 font-size:16px 与更小的 padding，
     结果它比旁边的标签高一截（用户指出的第①点）。这里只调字重与最小宽度。 */
  .tab.add{font-weight:700;color:#52525b;padding:7px 13px;min-width:0;justify-content:center}
  .tab.add .tabn{overflow:visible}
  .tab.add:hover{color:#fff;background:#52525b}
  .tab.add.on{color:#18181b;background:#fff}
  .addbox{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:#fcfcfd}
  .btn.big{font-size:14px;padding:10px 18px;border-radius:8px}
  /* 一键纳管的进度列表：使用者要的"等待提示/进度反馈"就长在这里 */
  .flow{margin-top:12px}
  .fstep{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed #eee;font-size:12.5px}
  .fstep:last-child{border-bottom:none}
  .fstep.ok{color:#15803d}
  .fstep.err{color:#b45309}
  .fstep.run{color:#52525b}
  .runlog{max-height:220px;overflow:auto;background:#18181b;color:#e4e4e7;border-radius:6px;padding:8px 10px;
          font-size:11px;line-height:1.45;margin:4px 0 6px;white-space:pre-wrap}
  .addbox .ph{font-weight:650;font-size:12.5px;margin-bottom:5px}
  .btn{border:1px solid #d4d4d8;background:#fff;border-radius:7px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .btn:hover{background:#f4f4f5}
  .btn.primary{background:#18181b;color:#fff;border-color:#18181b}
  .btn.primary:hover{background:#3f3f46}
  .pathin{width:100%;max-width:520px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;
          font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}
  .scanout{margin-top:10px}
  .scanrep{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:#fff;margin-top:8px}
  .scanrep .kpi2{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#3f3f46}
  .scanrep .kpi2 b{font-size:16px;font-variant-numeric:tabular-nums}
  /* 版本号的轴标识：小、灰、紧贴数字，避免喧宾夺主但让人一眼知道这是哪个号 */
  .rb{color:#b45309;font-weight:600}
  /* 本地服务的可行动提示：命令 + 复制 + 重新检测（替代原先的六处死胡同文案） */
  .servehint{border:1px solid #e4e4e7;border-left:3px solid #2563eb;border-radius:7px;padding:9px 11px;background:#f8fafc;margin-top:6px}
  .servehit{border:1px solid #bbf7d0;border-left:3px solid #16a34a;border-radius:7px;padding:9px 11px;background:#f0fdf4;margin-top:6px}
  .cmdrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .cmdrow .cmd{flex:1;min-width:240px;margin:0}
  .statbox{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:10px 0;background:#fcfcfd}
  .statgrid{display:flex;gap:22px;flex-wrap:wrap}
  .statgrid .st .k{font-size:11px;color:#71717a;margin-bottom:2px}
  .statgrid .st .v{font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
  .wstag{font-size:10.5px;color:#52525b;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:5px;
         padding:0 5px;margin-left:6px;font-weight:500}
  .vax{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.02em;color:#71717a;
       background:#f4f4f5;border:1px solid #e4e4e7;border-radius:4px;padding:0 3px;margin-right:3px;
       vertical-align:1px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .vax.c{color:#1d4ed8;background:#eff6ff;border-color:#dbeafe}
  .vax.t{color:#7c3aed;background:#f5f3ff;border-color:#ede9fe}
  .pill2{display:inline-block;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:20px;
         padding:1px 8px;font-size:11px;margin-right:4px;color:#52525b}
  .plusbox{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:14px;background:#fcfcfd}
  .plusbox .ph{font-weight:650;font-size:12.5px;margin-bottom:5px}
  .plusbox .prow{padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;border:1px solid #e4e4e7;background:#fff;margin-bottom:4px}
  .plusbox .prow:hover{background:#f4f4f5;border-color:#d4d4d8}
  .plusbox .cmd{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
       background:#f4f4f5;border:1px solid #e4e4e7;border-radius:6px;padding:5px 8px;margin:4px 0;
       user-select:all;overflow-x:auto;white-space:pre}
  [data-en]{display:none}
  body.en [data-zh]{display:none}
  body.en [data-en]{display:inline}
</style>
</head>

function tr(text, lang = 'zh') {
  if (lang === 'zh' || lang == null) return text;
  const s = String(text ?? '');
  if (!s) return s;
  const hit = DICT[s];
  if (hit && hit[lang]) return hit[lang];
  for (const p of PATTERNS) {
    const m = s.match(p.re);
    if (m) return p.to(m);
  }
  return s;   // 未收录：原样返回（宁可显中文，也不要机器翻译出歧义）
}


function trAll(list, lang) {
  if (Array.isArray(list)) return list.map((x) => tr(x, lang));
  if (list && typeof list === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(list)) out[k] = typeof v === 'string' ? tr(v, lang) : v;
    return out;
  }
  return list;
}


function i18nMisses(texts, lang = 'en') {
  const miss = [];
  for (const t of texts) {
    const s = String(t ?? '').trim();
    if (!s) continue;
    if (!/[\u4e00-\u9fa5]/.test(s)) continue;      // 无中文，无需翻译
    if (tr(s, lang) === s) miss.push(s);
  }
  return [...new Set(miss)];
}

      id, row: i, lane,
      x: r2(pad.l + lane * laneW),
      y: r2(top + i * rowH + rowH / 2),
      node: n,
    };
    rows.push(row);
    if (!rowById.has(id)) rowById.set(id, row);   // 同 id 重复时取最上一行（确定性）
  }

  const joinOffset = rowH / 2;                    // 斜线切入点：子节点上方半行
  const spans = new Map();                        // lane → [{ y1, y2, kind, color }]
  const diagonals = [];
  const merges = [];
  const pushSpan = (lane, y1, y2, kind, color) => {
    if (!(y2 > y1)) return;                       // 零长度竖线不画
    if (!spans.has(lane)) spans.set(lane, []);
    spans.get(lane).push({ y1, y2, kind, color });
  };
  for (let i = 0; i < rows.length; i++) {
    const child = rows[i];
    const n = child.node;
    const parents = Array.isArray(n.parents) ? n.parents : [];
    const isMergeNode = n.isMerge === true || parents.length >= 2;
    const childColor = typeof n.color === 'string' && n.color
      ? n.color
      : (laneColor.get(child.lane) || '#6b7280');
    const parentInfo = [];
    for (let j = 0; j < parents.length; j++) {
      const p = rowById.get(String(parents[j]));
      if (!p) continue;                           // 父节点不在本图（更早历史）：跳过该边
      parentInfo.push({ id: p.id, lane: p.lane, x: p.x, y: p.y });
      if (p.lane === child.lane) {
        pushSpan(child.lane, Math.min(p.y, child.y), Math.max(p.y, child.y), 'straight', childColor);
      } else {
        const kind = isMergeNode ? 'merge' : 'branch';
        let joinY = child.y - joinOffset;
        if (joinY < p.y) joinY = p.y > child.y ? child.y : p.y;
        if (joinY > child.y) joinY = child.y;
        pushSpan(p.lane, Math.min(p.y, joinY), Math.max(p.y, joinY), kind, laneColor.get(p.lane) || childColor);
        diagonals.push({
          x1: p.x, y1: r2(joinY), x2: child.x, y2: child.y,
          color: childColor, lane: child.lane, kind,
        });
      }
    }
    if (isMergeNode) {
      merges.push({
        id: child.id, row: child.row, lane: child.lane, x: child.x, y: child.y,
        color: childColor, parents: parentInfo,
      });
    }
  }

  const lines = [];
  const emitRun = (run, lane) => {
    const kind = run.kinds.has('straight')
      ? 'straight'
      : (run.kinds.has('branch') ? 'branch' : 'merge');
    const x = r2(pad.l + lane * laneW);
    return {
      x1: x, y1: r2(run.y1), x2: x, y2: r2(run.y2),
      color: laneColor.get(lane) || run.color || '#6b7280',
      lane, kind,
    };
  };
  const laneIds = Array.from(spans.keys()).sort((a, b) => a - b);
  for (let li = 0; li < laneIds.length; li++) {
    const lane = laneIds[li];
    const list = spans.get(lane).slice().sort((a, b) => (a.y1 - b.y1) || (a.y2 - b.y2));
    let cur = null;
    for (let k = 0; k < list.length; k++) {
      const s = list[k];
      if (cur && s.y1 <= cur.y2 + 0.001) {        // 相接或重叠 → 并入同一段（不留断点）
        if (s.y2 > cur.y2) cur.y2 = s.y2;
        cur.kinds.add(s.kind);
      } else {
        if (cur) lines.push(emitRun(cur, lane));
        cur = { y1: s.y1, y2: s.y2, kinds: new Set([s.kind]), color: s.color };
      }
    }
    if (cur) lines.push(emitRun(cur, lane));
  }
  for (let i = 0; i < diagonals.length; i++) {    // 斜线后画，压在竖线之上
    const d = diagonals[i];
    lines.push({
      x1: r2(d.x1), y1: r2(d.y1), x2: r2(d.x2), y2: r2(d.y2),
      color: d.color, lane: d.lane, kind: d.kind,
    });
  }

  const laneList = [];
  for (let l = 0; l <= maxLane; l++) {
    const text = laneText.get(l) || '';
    laneList.push({
      id: text || ('L' + l), lane: l,
      x: r2(pad.l + l * laneW), labelY: r2(pad.t + 11),
      color: laneColor.get(l) || '#6b7280', text,
    });
  }

  return {
    width: r2(pad.l + pad.r + maxLane * laneW + reserveRight),
    height: r2(top + rows.length * rowH + pad.b),
    rowH, laneW: r2(laneW), padding: pad, labelH, reserveRight, laneCount: maxLane + 1,
    rows, lines, merges, lanes: laneList,
  };
}


function renderGraphSvg(graphData, opts) {
  const o = opts == null ? {} : opts;
  const esc = typeof escapeXml === 'function'
    ? escapeXml
    : function (v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
  const showLabels = o.showLabels !== false;
  const showNodeIds = o.showNodeIds === true;
  const lay = layoutGraph(graphData, {
    rowH: o.rowH,
    laneW: o.laneW,
    padding: o.padding,
    showLabels: o.showLabels,
    maxWidth: o.maxWidth,
    reserveRight: typeof o.reserveRight === 'number' && o.reserveRight > 0
      ? o.reserveRight
      : (showNodeIds ? 52 : (showLabels ? 12 : 0)),
  });
  const font = typeof o.fontFamily === 'string' && o.fontFamily
    ? o.fontFamily
    : "-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif";
  const n2 = (v) => Math.round(v * 100) / 100;
  const aria = '版本树：' + lay.rows.length + ' 个版本 · ' + lay.laneCount + ' 条车道 · ' + lay.merges.length + ' 个合并点';
  const parts = [];
  parts.push(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n2(lay.width) + ' ' + n2(lay.height)
    + '" width="' + n2(lay.width) + '" height="' + n2(lay.height) + '" role="img" aria-label="'
    + esc(aria) + '" font-family="' + esc(font) + '">',
  );

  for (let i = 0; i < lay.lines.length; i++) {
    const L = lay.lines[i];
    parts.push(
      '<line x1="' + n2(L.x1) + '" y1="' + n2(L.y1) + '" x2="' + n2(L.x2) + '" y2="' + n2(L.y2)
      + '" stroke="' + esc(L.color) + '" stroke-width="' + (L.kind === 'straight' ? 1.6 : 1.4)
      + '" stroke-linecap="round" opacity="0.9" data-kind="' + esc(L.kind) + '"/>',
    );
  }

  for (let i = 0; i < lay.rows.length; i++) {
    const r = lay.rows[i];
    const n = r.node || {};
    const color = typeof n.color === 'string' && n.color ? n.color : '#6b7280';
    const bits = [r.id];
    if (n.branch != null && n.branch !== '') bits.push('分支 ' + n.branch);
    if (typeof n.fitness === 'number') bits.push('fitness ' + n.fitness);
    if (n.cap != null) bits.push('cap ' + n.cap + (n.gate ? ' · ' + n.gate : ''));
    if (n.rollbackFrom) bits.push('回退自 ' + n.rollbackFrom);
    if (n.note) bits.push(String(n.note));
    const g = [];
    g.push('<title>' + esc(bits.join(' · ')) + '</title>');
    if (n.cap != null) {
      const dash = n.gate === 'infeasible' ? ' stroke-dasharray="2.5 2.5"' : '';
      g.push(
        '<circle cx="' + n2(r.x) + '" cy="' + n2(r.y) + '" r="7.5" fill="none" stroke="#c62828"'
        + ' stroke-width="1.2"' + dash + '/>',
      );
    }
    g.push(
      '<circle cx="' + n2(r.x) + '" cy="' + n2(r.y) + '" r="4.5" fill="' + esc(color)
      + '" stroke="#ffffff" stroke-width="1.2"/>',
    );
    if (n.rollbackFrom) {
      g.push(
        '<text x="' + n2(r.x + 6) + '" y="' + n2(r.y - 5) + '" font-size="10" fill="' + esc(color)
        + '" opacity="0.9">↩</text>',
      );
    }
    if (showNodeIds) {
      g.push(
        '<text x="' + n2(r.x + 8) + '" y="' + n2(r.y + 3.5) + '" font-size="9" fill="#3f3f46"'
        + ' opacity="0.9">' + esc(r.id) + '</text>',
      );
    }
    parts.push(
      '<g class="ps-node" data-id="' + esc(r.id) + '"'
      + (n.isMerge === true ? ' data-merge="true"' : '') + '>' + g.join('') + '</g>',
    );
  }

  if (showLabels) {
    for (let i = 0; i < lay.lanes.length; i++) {
      const L = lay.lanes[i];
      if (!L.text) continue;
      parts.push(
        '<text x="' + n2(L.x) + '" y="' + n2(L.labelY) + '" font-size="11" fill="' + esc(L.color)
        + '" opacity="0.75" text-anchor="middle">' + esc(L.text) + '</text>',
      );
    }
  }

  parts.push('</svg>');
  return parts.join('');
}


function graphStats(graphData) {
  const src = graphData == null ? {} : graphData;
  const nodes = Array.isArray(src.nodes) ? src.nodes : [];
  const lanes = Array.isArray(src.lanes) ? src.lanes : [];
  const branchKeys = new Set();
  let merges = 0;
  let gatedCount = 0;
  let maxFitness = null;
  let minFitness = null;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i] == null ? {} : nodes[i];
    const parents = Array.isArray(n.parents) ? n.parents : [];
    if (n.isMerge === true || parents.length >= 2) merges++;
    if (n.gate != null && n.gate !== '') gatedCount++;
    if (typeof n.fitness === 'number' && Number.isFinite(n.fitness)) {
      if (maxFitness == null || n.fitness > maxFitness) maxFitness = n.fitness;
      if (minFitness == null || n.fitness < minFitness) minFitness = n.fitness;
    }
    branchKeys.add(
      n.branch != null && n.branch !== ''
        ? 'b:' + String(n.branch)
        : 'lane:' + (typeof n.lane === 'number' ? n.lane : 0),
    );
  }
  return {
    versions: nodes.length,
    branches: lanes.length > 0 ? lanes.length : branchKeys.size,
    merges, maxFitness, minFitness, gatedCount,
  };
}

<script>
/* ── 标签页状态机内联自 lib/tabs.mjs（零依赖纯函数；Node 侧单测同一份实现）── */


const ADD_TAB = '+';


const TAB_STATE_VERSION = 1;


function pidList(projects) {
  return (projects || []).map((p) => (typeof p === 'string' ? p : (p && p.pid) || null)).filter(Boolean);
}


function normalizeTabs(all, pref) {
  const allPids = pidList(all);
  if (!pref || !Array.isArray(pref.open)) {
    return { open: allPids.slice(), active: allPids[0] ?? null, known: allPids.slice(), version: TAB_STATE_VERSION };
  }
  const known = Array.isArray(pref.known) ? pref.known : [];
  const seen = new Set();
  const open = [];
  for (const pid of pref.open) {
    if (!allPids.includes(pid) || seen.has(pid)) continue;   // 规则 2 + 去重
    seen.add(pid);
    open.push(pid);
  }
  for (const pid of allPids) {                                // 规则 3：新增项目自动打开
    if (seen.has(pid) || known.includes(pid)) continue;
    seen.add(pid);
    open.push(pid);
  }
  const active = pref.active === ADD_TAB ? ADD_TAB
    : (open.includes(pref.active) ? pref.active : (open[0] ?? null));
  return { open, active, known: allPids.slice(), version: TAB_STATE_VERSION };
}


function activate(state, pid) {
  if (pid === ADD_TAB) return { ...state, active: ADD_TAB };
  if (!state.open.includes(pid)) return { ...state, open: state.open.concat(pid), active: pid };
  return { ...state, active: pid };
}


function closeTab(state, pid) {
  const i = state.open.indexOf(pid);
  if (i < 0) return state;
  const open = state.open.filter((x) => x !== pid);
  let active = state.active;
  if (active === pid) active = open[i] ?? open[i - 1] ?? null;
  return { ...state, open, active };
}


function openTab(state, pid) {
  return activate(state, pid);
}


const isAddPage = (state) => state.active === ADD_TAB;


function hiddenProjects(all, state) {
  const open = new Set(state.open);
  return pidList(all).filter((p) => !open.has(p));
}


function emptyHintKey(state) {
  return state.open.length ? null : 'noOpenTabs';
}

<script>
const SERVE_MODE = false;
const SERVE_CMD = "/usr/local/bin/supervisor serve --workspace /Users/huangjian/vibe-workshop/DSH-mv-session";
const SERVE_WS = "/Users/huangjian/vibe-workshop/DSH-mv-session";
/* ── 加入新工程页内联自 lib/addproject.mjs ──
   必须走插值而不是直接写在模板里：模板里的字面文本会被求值，
   换行转义会变成真换行、正则里的反斜杠转义会被吃掉（正则静默坏掉）。
   注：这段注释里连美元加大括号都不能出现 —— 那是插值语法本身。── */


function parseGitLog(text, limit = 12) {
  const out = [];
  for (const line of String(text ?? '').split(String.fromCharCode(10))) {
    const t = line.trim();
    if (!t) continue;
    const tab = t.indexOf(String.fromCharCode(9));
    const head = tab >= 0 ? t.slice(0, tab) : t;
    const msg = tab >= 0 ? t.slice(tab + 1) : '';
    const parts = head.split(' ');
    if (parts.length < 4) continue;
    const newSha = parts[1];
    const ts = parts[parts.length - 2];
    if (!/^[0-9a-f]{7,40}$/.test(newSha) || !/^\d+$/.test(ts)) continue;
    out.push({
      sha: newSha.slice(0, 8),
      at: new Date(Number(ts) * 1000).toISOString().slice(0, 16).replace('T', ' '),
      msg,
    });
  }
  return out.reverse().slice(0, limit);
}


function summarizeEntries(files) {
  const byExt = {};
  let tests = 0;
  for (const name of files) {
    const dot = name.lastIndexOf('.');
    const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '(无扩展名)';
    byExt[ext] = (byExt[ext] || 0) + 1;
    if (/test|spec/i.test(name)) tests += 1;
  }
  return { files: files.length, tests, byExt };
}



const isServeMode = () => typeof SERVE_MODE !== 'undefined' && SERVE_MODE === true;

const api = (p, body) => fetch(p, body === undefined ? {} : {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
}).then((r) => r.json());


function serveAddPage() {
  const hidden = hiddenProjects(ALL_PIDS, TABS);
  const reopen = hidden.length
    ? '<div class="addbox" style="margin-bottom:14px"><div class="ph">' + pick('重新打开已关闭的项目', 'Reopen a closed project') + '</div>'

          + ' <span class="muted small">' + escHtml(pid) + '</span></div>').join('') + '</div>'
    : '';
  return '<section><h2>' + pick('加入新工程', 'Add a project')
    + ' <span class="tag">' + pick('一个按钮：选目录 → 自动采集、纳管、安装 → 打开报表页',
        'one button: pick a folder → scan, register, set up → open the report') + '</span></h2>'
    + reopen

    + '<button class="btn primary big" id="oneClick">' + pick('① 选择工程目录并开始…', '1. Choose a folder and start…') + '</button>'
    + '<div class="small muted" style="margin-top:6px">'
    + pick('会弹出系统文件管理器；选定后自动完成采集、登记、安装与报表，无需再点。',
           'An OS file manager opens; after you pick, scanning, registration, setup and the report run automatically.')
    + '</div>'
    + '<div id="flow" class="flow"></div>'
    + '<details style="margin-top:12px"><summary class="small muted">' + pick('或手动填路径', 'or paste a path') + '</summary>'
    + '<input class="pathin" id="dirPath" placeholder="' + escHtml(pick('例如 /Users/you/projects/my-repo', 'e.g. /Users/you/projects/my-repo')) + '">'
    + ' <button class="btn" id="doInspect">' + pick('仅采集（登记前先看看）', 'scan only (peek before registering)') + '</button>'
    + '<div id="scanOut" class="scanout"></div></details>'
    + '</div></section>';
}


async function runAddFlow(dir) {
  const box = document.getElementById('flow');
  const steps = [];
  const render = () => {
    if (!box) return;
    box.innerHTML = steps.map((s) =>
      '<div class="fstep ' + (s.state || 'run') + '">' + (s.state === 'ok' ? '✓' : s.state === 'err' ? '✗' : '◌')
      + ' <b>' + escHtml(s.name) + '</b> <span class="small muted">' + escHtml(s.detail || '') + '</span></div>'
      + (s.out ? '<pre class="runlog">' + escHtml(s.out) + '</pre>' : '')).join('');
  };
  const add = (name, detail) => { const s = { name, detail, state: 'run' }; steps.push(s); render(); return s; };
  const setOut = (s, text) => { s.out = (s.out || '') + text; render(); };

  try {
    const a = add(pick('采集目录', 'Scan folder'), dir);
    const r = await api('/api/inspect', { path: dir });
    if (r.error) { a.state = 'err'; a.detail = pick(r.error, null); render(); return; }
    const g = r.git || {};
    a.state = 'ok';
    a.detail = `${r.files} ${pick('文件', 'files')} · ${r.tests} ${pick('测试文件', 'test files')}`
      + (g.branch ? ` · git ${g.branch} ${(g.commits || []).length} ${pick('提交', 'commits')}`
        + ` · ${pick('测试相关', 'test-related')} ${(g.testCommits || []).length}` : ` · ${pick('非 git 目录', 'not a git repo')}`);
    render();

    let pid = (r.projects && r.projects[0] && r.projects[0].pid) || null;
    if (!pid) {
      const derived = String(r.name || '').toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'project';
      const b = add(pick('登记纳管', 'Register'), pick('工程 id：', 'project id: ') + derived);
      const reg = await api('/api/register', { path: dir, pid: derived, name: r.name });
      if (reg.ok) { pid = reg.pid; b.state = 'ok'; b.detail = pick('已登记为工程 ', 'registered as ') + reg.pid; }
      else if (/已存在/.test(reg.error || '')) { pid = derived; b.state = 'ok'; b.detail = pick('已存在，沿用 ', 'already registered, reusing ') + derived; }
      else { b.state = 'err'; b.detail = pick(reg.error, null); render(); return; }
      render();
    } else {
      const b = add(pick('登记纳管', 'Register'), pick('该目录已登记为工程 ', 'already registered as ') + pid);
      b.state = 'ok'; render();
    }

    if ((r.suggestedSteps || []).length) {
      const c = add(pick('运行安装', 'Run setup'), r.suggestedSteps.map((x) => x.cmd + ' ' + x.args.join(' ')).join(' ;; '));
      const job = await api('/api/setup', { path: dir, steps: r.suggestedSteps });
      if (!job.ok) { c.state = 'err'; c.detail = pick(job.error, null); render(); }
      else {
        await new Promise((resolve) => {
          const es = new EventSource('/api/job/' + job.jobId + '/events');
          es.onmessage = (ev) => {
            const d = JSON.parse(ev.data);
            if (d.type === 'output') setOut(c, d.text);
            else if (d.type === 'step-end') setOut(c, '\n' + (d.code === 0 ? '✔ ' : '✘ ') + d.cmd + ' exit ' + d.code + '\n');
            else if (d.type === 'done') { c.state = 'ok'; c.detail = pick('安装完成', 'setup finished'); render(); es.close(); resolve(); }
            else if (d.type === 'aborted') { c.state = 'err'; c.detail = pick('安装中断', 'setup aborted'); render(); es.close(); resolve(); }
          };
          es.onerror = () => { c.state = 'err'; c.detail = pick('进度连接中断', 'progress stream lost'); es.close(); resolve(); };
        });
      }
    } else {
      const c = add(pick('运行安装', 'Run setup'), pick('未检测到需要安装的依赖（无 package.json / requirements.txt）', 'no dependencies detected'));
      c.state = 'ok'; render();
    }

    const d = add(pick('打开报表页', 'Open report'), pick('工程 ', 'project ') + pid);
    d.state = 'ok'; render();
    try {
      const st = JSON.parse(localStorage.getItem(LS_KEY) || 'null') || { open: [], active: null, known: [] };
      st.open = Array.from(new Set([...(st.open || []), pid]));
      st.active = pid;
      st.known = Array.from(new Set([...(st.known || []), pid]));
      localStorage.setItem(LS_KEY, JSON.stringify(st));
    } catch (e) {  }
    await new Promise((r2) => setTimeout(r2, 400));
    location.reload();
  } catch (e) {
    add(pick('出错', 'Error'), String((e && e.message) || e)).state = 'err';
    render();
  }
}

async function runSetupWithProgress(dir, steps) {
  const out = document.getElementById('setupOut');
  const put = (html) => { if (out) out.innerHTML = html; };
  put('<div class="small muted">' + pick('正在执行…', 'Running…') + '</div>');
  const r = await api('/api/setup', { path: dir, steps });
  if (!r.ok) { put('<div class="small" style="color:#b45309">' + escHtml(pick(r.error, null) || '?') + '</div>'); return; }
  let log = '';
  const bar = '<div class="prog"><i id="progBar" style="width:0%"></i></div>';
  put(bar + '<pre id="setupLog" class="runlog"></pre>');
  const pre = document.getElementById('setupLog');
  const barEl = document.getElementById('progBar');
  const total = steps.length;
  const es = new EventSource('/api/job/' + r.jobId + '/events');
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'step-start') {
      log += '\n▶ [' + (d.index + 1) + '/' + total + '] ' + d.cmd + ' ' + d.args.join(' ') + '\n';
      if (barEl) barEl.style.width = Math.round((d.index / total) * 100) + '%';
    } else if (d.type === 'output') {
      log += d.text;
    } else if (d.type === 'step-end') {
      log += '\n' + (d.code === 0 ? '✔ 完成' : '✘ 失败（退出码 ' + d.code + '）') + (d.error ? ' ' + d.error : '') + '\n';
      if (barEl) barEl.style.width = Math.round(((d.index + 1) / total) * 100) + '%';
    } else if (d.type === 'done') {
      log += '\n== 全部完成 =='; es.close();
    } else if (d.type === 'aborted') {
      log += '\n== 已中止（某一步失败）=='; es.close();
    }
    if (pre) { pre.textContent = log; pre.scrollTop = pre.scrollHeight; }
  };
  es.onerror = () => { log += '\n（进度连接中断，服务可能已停止）'; if (pre) pre.textContent = log; es.close(); };
}

}





const SERVE_PORTS = [7799, 7800, 7801, 7802];


async function probeServe() {
  for (const port of SERVE_PORTS) {
    let timer = null;
    try {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      if (ctrl) timer = setTimeout(function () { ctrl.abort(); }, 700);
      const r = await fetch('http://127.0.0.1:' + port + '/api/health',
        ctrl ? { cache: 'no-store', signal: ctrl.signal } : { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j.ok) return { port, workspace: j.workspace, url: 'http://127.0.0.1:' + port + '/' };
    } catch (e) {  }
    finally { if (timer) clearTimeout(timer); }
  }
  return null;
}

async function probeWorkspace(handle) {
  const out = { isWorkspace: false, projects: [] };
  try {
    const data = await handle.getDirectoryHandle('data', { create: false });
    const projects = await data.getDirectoryHandle('projects', { create: false });
    out.isWorkspace = true;
    for await (const child of projects.values()) {
      if (child.kind !== 'directory') continue;
      try {
        const fh = await child.getFileHandle('project.json', { create: false });
        const meta = JSON.parse(await (await fh.getFile()).text());
        out.projects.push({ pid: child.name, name: meta.name || child.name });
      } catch (e) {
        out.projects.push({ pid: child.name, name: child.name });   // 没 project.json 的目录也报出来
      }
    }
  } catch (e) {
    out.isWorkspace = false;      // 没有 data/projects 就不是工作区，不是错误
  }
  return out;
}


async function scanDirectory(handle) {
  const names = [];
  let dirs = 0, hasGit = false, gitHandle = null;
  const walk = async (dir, depth) => {
    if (depth > 3) return;
    for await (const entry of dir.values()) {
      if (entry.name === 'node_modules' || entry.name === '.DS_Store' || entry.name === '.git') {
        if (entry.name === '.git' && entry.kind === 'directory') { hasGit = true; gitHandle = entry; }
        continue;
      }
      if (entry.kind === 'directory') { dirs += 1; await walk(entry, depth + 1); }
      else names.push(entry.name);
    }
  };
  await walk(handle, 0);
  const s = summarizeEntries(names);
  const out = { name: handle.name, files: s.files, dirs, tests: s.tests, byExt: s.byExt, hasGit, commits: [], workspace: null };
  try { out.workspace = await probeWorkspace(handle); } catch (e) { out.workspace = null; }
  if (gitHandle) {
    try {
      const logsDir = await gitHandle.getDirectoryHandle('logs', { create: false });
      const headFh = await logsDir.getFileHandle('HEAD', { create: false });
      out.commits = parseGitLog(await (await headFh.getFile()).text());
    } catch (e) {
      out.gitErr = String((e && e.message) || e);
    }
  }
  return out;
}

async function bindServeHint() {
  const slot = document.getElementById('serveSlot') || document.getElementById('serveHint');
  const refresh = async () => {
    const hit = await probeServe();
    if (slot && hit) slot.innerHTML = serveBannerHTML(hit);
    return hit;
  };
  await refresh();
  document.querySelectorAll('#copyServeCmd').forEach((b) => {
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(SERVE_CMD); b.textContent = pick('已复制', 'Copied'); }
      catch (e) {
        const t = document.getElementById('serveCmdText');
        if (t && window.getSelection) {
          const r = document.createRange(); r.selectNodeContents(t);
          const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        }
        b.textContent = pick('已选中，按 ⌘C', 'Selected — press ⌘C');
      }
      setTimeout(() => { b.textContent = pick('复制', 'Copy'); }, 1600);
    };
  });
  document.querySelectorAll('#recheckServe').forEach((b) => {
    b.onclick = async () => {
      b.textContent = pick('检测中…', 'Checking…');
      const hit = await refresh();
      b.textContent = hit ? pick('已找到', 'Found') : pick('仍未检测到', 'Still not found');
      setTimeout(() => { b.textContent = pick('我已启动，重新检测', 'Started it — re-check'); }, 1800);
    };
  });
}


if (typeof document !== 'undefined' && document.getElementById('serveHint') && !isServeMode()) {

const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));   // 命名避碰：graph.mjs 的 renderGraphSvg 内部也有 const esc
const fmt = (x, n = 2) => (x == null ? '—' : Number(x).toFixed(n));
const deltaStr = (x) => (x == null ? '—' : `${x > 0 ? '+' : ''}${Number(x).toFixed(2)}`);
const deltaColor = (x) => (x == null ? '#6b7280' : x > 0.01 ? '#15803d' : x < -0.01 ? '#c62828' : '#6b7280');
const bandOf = (v) => (v == null ? null : v >= 90 ? 'exemplary' : v >= 75 ? 'pass' : v >= 60 ? 'pass-with-conditions' : v >= 40 ? 'intervene' : 'regress-or-restart');
const round2 = (x) => Math.round(x * 100) / 100;   // ← 曾漏内联，导致渲染期 ReferenceError 而页面全空
const vShort = (v) => {
  if (v == null || v === '') return '';
  return String(v).split('+').map((part) => {
    const segs = String(part).replace(/^V/, '').split('.');
    if (!segs.every((x) => /^\d+$/.test(x))) return String(part);   // 非纯数字号（V1a 等）原样
    // 四段式是基本概念：段数不省，只去每段的前导零（01→1，02→2，00→0）
    return segs.map((x) => String(Number(x))).join('.');
  }).join('+');
};
/**
 * 带轴标识的版本号 —— 界面上【每一个】版本号都必须带轴。
 *
 * 用户两次指出三个号混在一起看不懂：SupV / CodeV / TestV 都是四段 xx.xx.xx.xx，
 * 而且【基线那一行的 SupV 与 CodeV 是同一个字符串 1.0.0.0】—— 不带轴标识，
 * 读者无法判断"这个 1.0.0.0"指的是哪个。上一轮我只在项目卡与得分热力加了标识，
 * 其余框里仍是裸号，于是看起来"每个框里都不一样"。
 * 现在收敛到这一个函数：凡显示版本号，一律经它。
 */
const VAX = { supv: 'SupV', codev: 'CodeV', testv: 'TestV' };
const vt = (kind, id) => (id == null || id === '' || id === '—')
  ? '<span class="muted">—</span>'
  : '<span class="vax">' + (VAX[kind] || kind) + '</span>' + escHtml(vShort(id));
/** 属性位（title 等）用的纯文本版本 */
const vtText = (kind, id) => (id == null || id === '') ? '—' : ((VAX[kind] || kind) + ' ' + vShort(id));
/** 属性位专用：t() 返回含双引号的 HTML，塞进 title="" 会把属性截断（实测踩过）。属性只能放纯文本。 */
const attrZh = (zh, en) => escHtml(en ? (zh + ' / ' + en) : zh);
/** 属性位双语标题（title 不能含 HTML 标签，故并列书写） */
const attrT = (zh, en) => escHtml(zh + ' ／ ' + en);
const t = (zh, en) => '<span data-zh>' + escHtml(zh) + '</span><span data-en>' + escHtml(en) + '</span>';

/**
 * 语言取数器（模块级，所有区块可用）：
 * 英文页优先取英文对照，缺英文时回落中文 —— 数据文本也能随语言切换。
 * 由 renderAll(lang) 生成的整页 HTML 决定 LANG；切换语言时整体替换 #app 内容。
 */
let LANG = 'zh';
/**
 * 语言取数（唯一机制）：中文原文 → 对照表 → 模式表 → 原样返回。
 * 显式 en 参数仍可覆盖（少量数据自带英文对照时用），但不再是主要手段。
 */
const pick = (zh, en) => {
  if (LANG !== 'en') return zh;
  // 显式英文值须真的是英文：含中文即视为脏数据（历史脚本曾把中文写进 *En 字段），回落到对照表
  // 反斜杠必须写两个：写一个会被模板求值成真字符「一」（碰巧等价，但那是运气不是设计）。
  const looksEn = typeof en === 'string' && en && en !== zh && !/[\u4e00-\u9fa5]/.test(en);
  if (looksEn) return en;
  return typeof tr === 'function' ? tr(zh, 'en') : zh;
};

function spanOf(g) {
  const ts = (g.commits || []).map((c) => Date.parse(String(c.at).replace(' ', 'T') + ':00')).filter((x) => Number.isFinite(x));
  if (ts.length < 2) return '0';
  return String(Math.round((Math.max(...ts) - Math.min(...ts)) / 86400000));
}

function statsBlock(p) {
  const st = p.stats;
  if (!st) return '';
  if (st.error) {
    return '<div class="statbox"><span class="muted small">' + pick('统计不可用：','Statistics unavailable: ')
      + escHtml(pick(st.error, null)) + '</span></div>';
  }
  const g = st.git || {};
  const cell = (k, v, sub) => '<div class="st"><div class="k">' + escHtml(k) + '</div><div class="v">' + v + '</div>'
    + (sub ? '<div class="small muted">' + escHtml(sub) + '</div>' : '') + '</div>';
  const top = Object.keys(st.byExt || {}).sort((a, b) => st.byExt[b] - st.byExt[a]).slice(0, 5)
    .map((k) => '<span class="pill2">' + escHtml(k) + ' ' + st.byExt[k] + '</span>').join(' ');
  const gitVal = g.error ? '<span class="muted">—</span>'
    : escHtml(g.branch || '—') + ' <span class="small muted">' + (g.commits || []).length + ' ' + pick('次提交','commits') + '</span>';
  const gitSub = g.error ? pick(g.error, null)
    : [g.commits && g.commits[0] ? pick('最近','latest') + ' ' + g.commits[0].at : null,
       pick('跨度','span') + ' ' + spanOf(g) + ' ' + pick('天','d')].filter(Boolean).join(' · ');
  return '<div class="statbox">'
    + '<div class="small muted" style="margin-bottom:6px">' + pick('项目统计（自动采集）','Project statistics (collected automatically)')
    + (p.statsDir ? '　<span class="data" title="' + escHtml(p.statsDir) + '">📁</span>' : '') + '</div>'
    + '<div class="statgrid">'
    + cell(pick('规模','Scale'), st.files + ' <span class="small">' + pick('文件','files') + '</span>',
      st.dirs + ' ' + pick('目录','dirs') + ' · ' + st.tests + ' ' + pick('测试文件','test files'))
    + cell('git', gitVal, gitSub)
    + cell(pick('节奏','Cadence'), (g.last30 != null ? g.last30 : '—') + ' <span class="small">' + pick('近 30 天','last 30d') + '</span>',
      (g.last90 != null ? g.last90 : '—') + ' ' + pick('近 90 天','last 90d'))
    + cell(pick('测试轨迹','Test trail'), ((g.testCommits || []).length) + ' <span class="small">' + pick('次提交','commits') + '</span>',
      pick('路径含 test / spec','paths matching test / spec'))
    + '</div>'
    + (top ? '<div style="margin-top:7px"><span class="data">' + top + '</span></div>' : '')
    + (g.commits && g.commits[0] && g.commits[0].msg ? '<div class="small muted" style="margin-top:6px">'
        + pick('最新提交','Latest commit') + '　<span class="data">' + escHtml(g.commits[0].msg.slice(0, 90)) + '</span></div>' : '')
    + '</div>';
}

function axisMatrix(p) {
  const m = p.matrix;
  if (!m || !m.rows.length) return '';
  const colBase = {};
  for (let ci = 0; ci < m.cols.length; ci++) {
    const vals = m.grid.map((row) => row[ci]).filter((c) => c && c.fitness != null && !c.gate).map((c) => c.fitness);
    colBase[m.cols[ci]] = vals.length ? Math.max(...vals) : null;
  }
  const cell = (c, col) => {
    if (!c) return '<td class="muted" style="text-align:center" title="' + attrT('尚未组建', 'not assembled') + '">·</td>';
    if (c.fitness == null) {
      return '<td style="text-align:center;color:#6b7280" title="' + attrT('已由统一版本号管理、未评分', 'managed, not scored') + '">' + pick('待测','pending')
        + '<div class="small muted">' + vt('supv', c.supv || c.id) + '</div></td>';
    }
    const b = bandOf(c.fitness);
    const bc = BAND[b] ? BAND[b][2] : '#6b7280';
    const base = colBase[col];
    const gap = base == null ? null : round2(c.fitness - base);
    const top = base != null && gap === 0 && !c.gate;
    const rel = base == null ? '' : (top ? '<span style="color:#15803d">' + pick('最优','best') + '</span>' : deltaStr(gap));
    const gate = c.gate ? '<div><span class="pill" style="background:#7f1d1d">' + escHtml(c.gate) + '</span></div>' : '';
    const tr = c.testResult
      ? '<div class="small muted">' + escHtml(c.testResult.verdict || '')
        + (c.testResult.failed != null ? pick('失败','fail') + c.testResult.failed : '')
        + (c.testResult.items != null ? '/' + c.testResult.items : '') + '</div>'
      : '';
    return '<td style="text-align:center">'
      + '<div style="font-weight:650;font-size:15px;color:' + bc + '">' + (BAND[b] ? pick(BAND[b][0], BAND[b][1]) : '—') + '</div>'
      + '<div class="small" style="color:' + bc + ';font-variant-numeric:tabular-nums">' + fmt(c.fitness, 1)
      + '　<span style="color:' + deltaColor(gap) + '">' + rel + '</span></div>'
      + gate + tr
      + '<div class="small muted" title="' + attrT('监理版本号（底层管理键）', 'managed key') + '">' + vt('supv', c.supv || c.id) + '</div>'
      + '</td>';
  };
  return '<section><h2>③ ' + pick('版本矩阵','Version matrix')
    + ' <span class="tag">' + pick('统一版本号管理 · 来源：CodeV 被测体 + TestV 测试集（各自版本控制）· 每次组建只允许一条来源前进','one managed test version · sources: CodeV + TestV (each version-controlled)') + '</span></h2>'
    + '<div class="scrollx"><table><thead><tr><th>' + pick('被测物（CodeV）⧵ 测试集（TestV）','SUT (CodeV) ⧵ TESTSET (TestV)') + '</th>'
    + m.cols.map((c) => '<th style="text-align:center">' + (testLabel(p, c) ? escHtml(testLabel(p, c)) : vt('testv', c))
        + '<div class="small muted">' + vt('testv', c) + '</div></th>').join('')
    + '<th class="small muted">' + pick('来源号','source no.') + '</th></tr></thead><tbody>'
    + m.rows.map((r, i) => '<tr><th style="white-space:nowrap">' + vt('codev', r)
        + (intentOnly(r, p.graph?.nodes) ? ' <span class="muted small">' + escHtml(intentOnly(r, p.graph?.nodes)) + '</span>' : '') + '</th>'
        + m.grid[i].map((c, ci) => cell(c, m.cols[ci])).join('')
        + '<td class="small muted" style="white-space:nowrap">' + vt('codev', r) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="legend"><span>· ' + pick('未纳管（测试集扩张后须重跑）','not enrolled (must re-run after test-set growth)')
    + '</span><span>— ' + pick('已纳管未评分','enrolled, not scored') + '</span><span>' + pick('数字 = fitness','number = fitness')
    + '</span><span>✓ ' + pick('已记录测试结果','result recorded') + '</span><span>! '
    + pick('被门限压制','gated') + '</span></div>'
    + guidePanel(p) + '</section>';
}


const SUB_ZH = { timing: '工期', cost: '预算', deliverables: '范围', goal: '目标', accept: '验收', risk: '风险', quality: '质量' };
const SUB_EN = { timing: 'Schedule', cost: 'Budget', deliverables: 'Scope', goal: 'Goal', accept: 'Acceptance', risk: 'Risk', quality: 'Quality' };



function testLabel(p, testv) {
  const labs = p.testsetLabels || {};
  const zh = labs[testv] ?? null;
  const en = labs['en:' + testv] ?? null;
  if (!zh) return null;
  return pick(zh, en);
}

function labelOf(v) {
  const raw = String(v ?? '');
  const m = raw.match(/#([a-z]+)$/i);
  if (m && SUB_ZH[m[1].toLowerCase()]) return pick(SUB_ZH[m[1].toLowerCase()], null);
  const mm = raw.match(/^L(\\d)set#(.+)$/i);
  if (mm) return mm[2];
  return pick(raw, null);
}




function labelHtml(v) {
  return escHtml(labelOf(v));
}

function laneIndex(vs, v) {
  const lane = vs.filter((x) => (x.change?.M ?? null) === (v.change?.M ?? null));
  return lane.findIndex((x) => x.id === v.id) + 1;
}



function intentOnly(ver, nodes) {
  const t = intentOf(ver, nodes);
  return t === String(ver) || t === vShort(ver) ? '' : t;
}

function intentOf(ver, nodes) {
  const key = (x) => String(x ?? '');
  const n = (nodes || []).find((x) => key(x.codev) === key(ver))
    || (nodes || []).find((x) => key(x.testv) === key(ver))
    || (nodes || []).find((x) => key(x.id) === key(ver));
  const zh = String(n?.note || '').trim();
  const en = String(n?.noteEn || '').trim();
  if (LANG === 'en' ? en : zh) return LANG === 'en' ? en : zh;
  if (zh || en) return pick(zh || en, en || null);
  return String(ver);
}


function guidePanel(p) {
  const g = p.guide;
  if (!g || !g.coverage.enrolled) return '';
  const heading = '<h2 style="font-size:13px;margin-bottom:8px">' + pick('同类比较（版本矩阵的决策出口）','Comparable cohorts (the decision exit of the version matrix)')
    + ' <span class="tag">' + pick('只有单来源变化的格子才可比——跨列 / 跨行比都无意义','only cells differing on ONE source are comparable') + '</span></h2>';
  const best = (x, kind) => {
    if (!x) return '<span class="muted">—</span>';
    const other = kind === 'problem' ? x.coords.sut : x.coords.test;
    return '<b>' + vt(kind === 'problem' ? 'codev' : 'testv', other) + '</b> '
      + '<span style="color:#15803d;font-weight:650">' + fmt(x.fitness) + '</span>';
  };
  const rows1 = g.bestPerProblem.map(x =>
    '<tr><td>' + vt('testv', x.testVer) + ' ' + escHtml(testLabel(p, x.testVer) ?? pick(labelOf(x.testVer), null)) + '</td><td>' + x.comparable + '</td><td>' + best(x.best, 'problem') + '</td>'
    + '<td>' + (x.gain == null ? '—' : '+' + fmt(x.gain)) + '</td>'
    + '<td class="small muted">' + (x.gatedNote ? escHtml(x.gatedNote) : '') + '</td></tr>').join('');
  const rows2 = g.bestPerMethod.map(x =>
    '<tr><td>' + vt('codev', x.sutVer) + '</td><td>' + x.comparable + '</td><td>' + best(x.best, 'method') + '</td>'
    + '<td>' + (x.spread == null ? '—' : fmt(x.spread)) + '</td>'
    + '<td class="small muted">' + (x.worst ? pick('最差','worst') + escHtml(x.worst.coords.test) + ' ' + fmt(x.worst.fitness) : '') + '</td></tr>').join('');
  const pend = g.pending.length
    ? '<div class="small" style="margin-top:10px"><b>' + pick('待补测试','To fill in') + '</b>：'
      + g.pending.slice(0, 12).map(x => '<code>' + escHtml(x.sutVer) + '×' + escHtml(x.testVer) + '</code> <span class="muted">'
        + escHtml(pick(x.why, null)) + '</span>').join('　')
      + (g.pending.length > 12 ? ' <span class="muted">… +' + (g.pending.length - 12) + '</span>' : '') + '</div>'
    : '';
  return '<div style="margin-top:16px">' + heading + '</div>'
    + '<div class="grid" style="margin-top:4px">'
    + '<div><h2 style="font-size:13px;margin-bottom:2px">' + pick('问题 1 · 同样问题下，哪种配置最好','Q1 · Best configuration for the same problem') + '</h2>'
    + '<div class="small muted" style="margin-bottom:6px">' + pick('固定测试集版本（一列内可比）','fixed test-set version (comparable within a column)') + '</div>'
    + '<table><thead><tr><th>' + pick('TestV（问题）','TestV (problem)') + '</th><th>' + pick('可比','n')
    + '</th><th>' + pick('最优 CodeV','Best CodeV') + '</th><th>' + pick('领先','Lead') + '</th><th></th></tr></thead><tbody>'
    + rows1 + '</tbody></table></div>'
    + '<div><h2 style="font-size:13px;margin-bottom:2px">' + pick('问题 2 · 同样方法下，最佳使用场合','Q2 · Best-fit scenario for the same method') + '</h2>'
    + '<div class="small muted" style="margin-bottom:6px">' + pick('固定被测物版本（一行内可比）','fixed SUT version (comparable within a row)') + '</div>'
    + '<table><thead><tr><th>' + pick('CodeV（方法）','CodeV (method)') + '</th><th>' + pick('可比','n')
    + '</th><th>' + pick('最佳场合','Best fit') + '</th><th>' + pick('跨度','Spread') + '</th><th></th></tr></thead><tbody>'
    + rows2 + '</tbody></table></div></div>'
    + pend
    + '<div class="legend" style="margin-top:8px"><span>'
    + pick('可比性铁律：只有单轴变化的两个格子才可比——跨列比 fitness 等于换了尺子','Comparability rule: only cells differing on ONE axis are comparable')
    + '</span></div>';
}

function heatAndTrend(p) {
  const vs = p.versions;
  if (!vs.length) return '';
  const head = vs.map(v => '<th>' + vt('supv', v.id) + '</th>').join('');
  const cellHTML = (d, v) => {
    const x = v.dimensions?.[d];
    if (!x) return '<td class="muted">—</td>';
    const v0 = x.value;
    const col = v0 >= 75 ? '#16a34a' : v0 >= 60 ? '#ca8a04' : v0 >= 40 ? '#ea580c' : '#c62828';
    const numStyle = x.inherited
      ? 'color:#a1a1aa'
      : 'color:#18181b;font-weight:600';
    const barStyle = x.inherited ? 'opacity:.35' : '';
    return '<td title="' + attrT(x.inherited ? '继承自父版本（未重算）' : '本次实测', x.inherited ? 'inherited, not recomputed' : 'measured in this version') + '">'
      + '<div class="flex"><span style="min-width:38px;font-variant-numeric:tabular-nums;' + numStyle + '">' + fmt(v0, 1) + '</span>'
      + '<span class="bar" style="flex:1;' + barStyle + '"><i style="width:' + Math.max(2, v0) + '%;background:' + col + '"></i></span></div></td>';
  };
  const allInherited = (d) => vs.length > 0 && vs.every(v => v.dimensions?.[d]?.inherited);
  const rowsDims = DIMS.filter(d => !allInherited(d));
  const collapsed = DIMS.filter(allInherited);
  const body = rowsDims.map(d => '<tr><th>' + escHtml(pick(DIM_LABEL[d][0], DIM_LABEL[d][1])) + '</th>'
    + vs.map(v => cellHTML(d, v)).join('') + '</tr>').join('');
  const collapsedLine = collapsed.length
    ? '<div class="small muted" style="margin-top:7px">'
      + pick('以下维度在所有版本中都是【继承】的（这些层级没有重算它们），故不逐格重复：',
             'Inherited in every version (no layer recomputed them), so not repeated per column:')
      + ' ' + collapsed.map(d => {
        const last = vs[vs.length - 1].dimensions?.[d];
        return escHtml(pick(DIM_LABEL[d][0], DIM_LABEL[d][1])) + ' ' + fmt(last ? last.value : null, 1);
      }).join(' · ')
      + '</div>'
    : '';
  const trend = vs.map(v => {
    const b = v.fitness ? bandOf(v.fitness.value) : null;
    const col = b ? BAND[b][2] : '#6b7280';
    return '<tr><td><b>' + vt('supv', v.id) + '</b></td>'
      + '<td><span class="bar" style="width:200px"><i style="width:' + (v.fitness ? Math.max(2, v.fitness.value) : 0) + '%;background:' + col + '"></i></span></td>'
      + '<td style="font-variant-numeric:tabular-nums;color:' + col + '">' + (v.fitness ? fmt(v.fitness.value) : '—') + '</td>'
      + '<td class="small">' + (b ? pick(BAND[b][0], BAND[b][1]) : '—') + '</td>'
      + '<td class="small muted">' + escHtml((v.createdAt||'').slice(0,19).replace('T',' ')) + '</td></tr>';
  }).join('');
  return '<section><h2>④ ' + pick('六维记分卡','Six-dimension scorecard')
    + ' <span class="tag">' + pick('行 = 六维 · 列 = SupV · 条色 = 该维度所处档位 · 字色 = 本次实测 / 继承',
        'rows = dimensions · columns = SupV · bar colour = band of that dimension · text colour = measured / inherited') + '</span></h2>'
    + '<div class="small muted" style="margin-bottom:6px">'
    + pick('四段含义（三类号共用同一规则）　哪一段进位 = 本次变更的层级：'
      + 'L4「总」→ 第1段，L3「大」→ 第2段，L2「中」→ 第3段，L1「小」→ 第4段；进位后右侧各段清零。'
      + '所以版本图上黄色「中」道（L2）的每一次前进，都记在第 3 段上。',
           'Four segments (one rule for all three)　which segment carries = the change layer: '
      + 'L4 → segment 1, L3 → segment 2, L2 → segment 3, L1 → segment 4; lower segments reset on carry. '
      + 'So every L2 turn shows up in segment 3, matching the amber lane in the version graph.')
    + '</div>'
    + '<div class="scrollx"><table><thead><tr><th></th>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<div class="legend"><span>' + pick('灰字 = 继承自父版本（未重算；该层级的重算集不含这一维）',
        'grey = inherited from the parent version (not recomputed by this layer)') + '</span>'
    + '<span>' + pick('彩色粗字 = 本版本实测','bold coloured = measured in this version') + '</span></div>'
    + collapsedLine + '</section>'
    + '<section><h2>⑤ fitness ' + pick('趋势','trend')
    + ' <span class="tag">' + pick('横轴为配置序 Vn，非时间；时刻列于右侧','x-axis is config order Vn, not time') + '</span></h2>'
    + '<table><thead><tr><th>' + pick('版本','Version') + '</th><th></th><th>fitness</th><th>' + pick('档位','Band') + '</th><th>' + pick('时刻','Timestamp') + '</th></tr></thead><tbody>' + trend + '</tbody></table></section>';
}

function changeList(p) {
  const cl = p.changeLog || [];
  const vs = p.versions || [];
  const vrows = vs.filter(v => v.change?.note).map(v =>
    '<tr><td><span class="vax">SupV</span><span class="pill" style="background:' + (M_COLOR[v.change?.M] || '#6b7280') + '">' + escHtml(vShort(v.id)) + ' L' + escHtml(v.change?.L) + ' ' + escHtml(pick(v.change?.M, null)) + '</span></td>'
    + '<td class="small">' + escHtml(v.change?.A || '') + '</td><td>' + escHtml(pick(v.change?.note, v.change?.noteEn)) + '</td>'
    + '<td class="small muted" style="white-space:nowrap">' + escHtml((v.createdAt||'').slice(0,10)) + '</td></tr>').join('');
  const crows = cl.map(e => '<tr><td class="small muted" style="white-space:nowrap">' + escHtml((e.at||'').slice(0,10)) + '</td>'
    + '<td>' + escHtml(pick(e.kind || '', e.kindEn)) + '</td>'
    + '<td>' + escHtml(pick(e.text || e.reason || '', e.textEn || e.reasonEn)) + '</td></tr>').join('');
  const vtable = vrows
    ? '<table><thead><tr><th>' + pick('版本','Version') + '</th><th>' + pick('来源','Source') + '</th><th>'
      + pick('变更内容','What changed') + '</th><th>' + pick('日期','Date') + '</th></tr></thead><tbody>' + vrows + '</tbody></table>'
    : '';
  const ctable = crows
    ? '<h3>' + pick('项目要素变更（不动 Vn）','Project-element changes (no Vn)')
      + ' <span class="tag">' + pick('走变更日志，不占版本号','logged, takes no version number') + '</span></h3>'
      + '<table><thead><tr><th>' + pick('日期','Date') + '</th><th>' + pick('类别','Kind') + '</th><th>'
      + pick('内容','Detail') + '</th></tr></thead><tbody>' + crows + '</tbody></table>'
    : '';
  return '<section><h2>⑥ ' + pick('变更列表','Change log')
    + ' <span class="tag">' + pick('双账分离：被测体/测试集走 Vn，项目要素走变更日志','Two ledgers: SUT/test-set → Vn; project elements → change log') + '</span></h2>'
    + (vtable || ctable ? vtable + ctable
      : '<div class="empty">' + pick('暂无变更','No changes yet') + '</div>') + '</section>';
}

function deltaDetail(p) {
  const vs = p.versions.filter(v => v.deltaVsParent);
  const rows = vs.map(v => {
    const d = v.deltaVsParent;
    const cells = DIMS.map(dim => {
      if (!(v.R || []).includes(dim)) return '<td class="muted small">' + pick('继承','inh.') + '</td>';
      const x = d.dims?.[dim];
      return '<td style="color:' + deltaColor(x) + ';font-variant-numeric:tabular-nums">' + deltaStr(x) + '</td>';
    }).join('');
    const to = d.tradeoff === 'trade-off' ? ['有意权衡','trade-off','#15803d']
      : d.tradeoff === 'possible-mistake' ? ['疑似失误','possible mistake','#c62828']
      : ['中性','neutral','#6b7280'];
    const toHtml = pick(to[0], to[1]);
    return '<tr><td><b>' + (v.parent ? vt('supv', v.parent) : '') + '<span class="muted">→</span>' + vt('supv', v.id) + '</b></td>' + cells
      + '<td style="color:' + deltaColor(d.fitness) + ';font-variant-numeric:tabular-nums">' + deltaStr(d.fitness) + '</td>'
      + '<td><span class="pill" style="background:' + to[2] + '">' + toHtml + '</span></td></tr>';
  }).join('');
  return '<section><h2>⑦ Δ ' + pick('详情','detail')
    + ' <span class="tag">' + pick('只报重算集 R；继承维度不出现差值','Only R is reported; inherited dims show no delta') + '</span></h2>'
    + (rows ? '<table><thead><tr><th></th>'
        + DIMS.map(d => '<th>' + escHtml(pick(DIM_LABEL[d][0], DIM_LABEL[d][1])) + '</th>').join('')
        + '<th>Δ fitness</th><th>' + pick('权衡','Trade-off') + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="empty">' + pick('尚无 Δ（至少需要两个版本）','No deltas yet (need ≥2 versions)') + '</div>') + '</section>';
}

function evidenceView(p) {
  const vs = p.versions;
  const head = vs[vs.length-1];
  if (!head) return '';
  const rows = DIMS.map(d => {
    const x = head.dimensions?.[d];
    if (!x) return '';
    const ev = (x.evidence || []).map(e => '<code>' + escHtml(e) + '</code>').join(' ');
    const gp = (x.gaps || []).map((g) => {
      const t = typeof g === 'string' ? g : (g?.text ?? '');
      return '<div class="gap">' + escHtml(pick(t, typeof g === 'object' ? (g?.textEn ?? null) : null)) + '</div>';
    }).join('');
    return '<tr><td><b>' + escHtml(pick(DIM_LABEL[d][0], DIM_LABEL[d][1])) + '</b><br><span class="small muted">' + escHtml(DIM_LABEL[d][1]) + '</span></td>'
      + '<td class="small">' + escHtml(x.basis || '—') + (x.inherited ? ' <span class="muted small">' + pick('继承自','inherited from') + ' ' + escHtml(x.inheritedFrom) + '</span>' : '') + '</td>'
      + '<td style="font-variant-numeric:tabular-nums">' + fmt(x.confidence, 2) + '</td>'
      + '<td class="small">' + (ev || '<span class="muted">—</span>') + '</td>'
      + '<td>' + (gp || '<span class="muted small">—</span>') + '</td></tr>';
  }).join('');
  const stops = (p.stops || []).map(s => '<div class="stop"><b>' + escHtml(pick(s.kind, s.kindEn || null)) + '</b> <span class="small muted">'
    + escHtml((s.at||'').slice(0,19).replace('T',' ')) + '</span><br><span class="small">'
    + escHtml(pick(s.reason, s.reasonEn || null)) + '</span></div>').join('');
  return '<section><h2>⑧ ' + pick('证据与缺口','Evidence & gaps')
    + ' <span class="tag">' + pick('缺口只降置信度，不直接扣分（公理 2）','Gaps lower confidence, not score (axiom 2)') + '</span></h2>'
    + '<table><thead><tr><th>' + pick('维度','Dimension') + '</th><th>' + pick('依据','Basis') + '</th><th>' + pick('置信','Conf.')
    + '</th><th>' + pick('证据引用','Evidence') + '</th><th>' + pick('缺口','Gaps') + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
    + (stops ? '<h2 style="margin-top:16px">' + pick('停机记录','Stopped outputs') + ' <span class="tag">'
        + pick('停发 Δ 是合规输出，不是失败','Stopping Δ is a compliant output, not a failure') + '</span></h2>' + stops : '')
    + '</section>';
}


const ALL_PIDS = DATA.projects.map((p) => p.pid);
const LS_KEY = 'psup.tabs.v1';

function loadPref() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; }
}
function savePref(st) {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ open: st.open, active: st.active, known: st.known })); } catch (e) {}
}
let TABS = normalizeTabs(ALL_PIDS, loadPref());

function projOf(pid) { return DATA.projects.filter((x) => x.pid === pid)[0] || null; }

function projLabel(pid) {
  const p = projOf(pid);
  if (!p) return pid;
  const en = (p.projectEn && p.projectEn.name) || p.project.nameEn || null;
  return pick(p.project.name || pid, en);
}

function tabBarHTML(st) {
  const tabs = st.open.map((pid) =>
    '<div class="tab' + (pid === st.active ? ' on' : '') + '" data-tab="' + escHtml(pid) + '" title="' + escHtml(pid) + '">'
    + '<span class="tabn">' + escHtml(projLabel(pid)) + '</span>'
    + '<span class="tabx" data-close="' + escHtml(pid) + '" title="' + attrT('关闭该标签','Close this tab') + '">×</span>'
    + '</div>').join('');
  return '<nav class="tabs" id="tabs">' + tabs
    + '<div class="tab add' + (st.active === ADD_TAB ? ' on' : '') + '" id="tabAdd" data-tab="' + ADD_TAB + '"'
    + ' title="' + attrT('加入新工程','Add a project') + '"><span class="tabn">+</span></div>'
    + '</nav>';
}

function emptyStateHTML() {
  if (!DATA.projects.length) {
    return '<section><div class="empty">' + pick('data/projects 下暂无项目','No projects under data/projects') + '</div></section>';
  }
  return '<section><div class="empty">'
    + pick('所有项目标签都已关闭。点上面的 + 打开或新建工程。','All project tabs are closed. Click + above to reopen or create one.')
    + '</div></section>';
}

function renderView() {
  const lg = document.body.classList.contains('en') ? 'en' : 'zh';
  LANG = lg;
  const body = TABS.active === ADD_TAB ? addProjectPage()
    : (TABS.active && PROJ_HTML[lg][TABS.active]) ? PROJ_HTML[lg][TABS.active]
      : emptyStateHTML();
  const app = document.getElementById('app');
  app.innerHTML = tabBarHTML(TABS) + body;
  bindTabs();
  if (SERVE_MODE) bindServeAddPage();
  else {
    const btn = document.getElementById('pickDir');
    if (btn) btn.onclick = onPickDir;
    if (typeof bindServeHint === 'function') bindServeHint();
  }
}

function bindTabs() {
  const bar = document.getElementById('tabs');
  for (const el of bar.querySelectorAll('[data-tab]')) {
    el.onclick = () => { TABS = activate(TABS, el.getAttribute('data-tab')); savePref(TABS); renderView(); };
  }
  for (const el of bar.querySelectorAll('[data-close]')) {
    el.onclick = (ev) => { ev.stopPropagation(); TABS = closeTab(TABS, el.getAttribute('data-close')); savePref(TABS); renderView(); };
  }
  for (const el of document.querySelectorAll('[data-open]')) {
    el.onclick = () => { TABS = openTab(TABS, el.getAttribute('data-open')); savePref(TABS); renderView(); };
  }
}


async function onPickDir() {
  const out = document.getElementById('scanOut');
  const setOut = (html) => { if (out) out.innerHTML = html; };
  if (typeof window === 'undefined' || typeof window.showDirectoryPicker !== 'function') {
    setOut('<div class="small" style="color:#b45309">'
      + pick('此浏览器不支持目录选择。请用 Chrome / Edge，或改用本地服务模式。',
             'This browser has no directory picker. Use Chrome / Edge, or the local server mode.') + '</div>');
    return;
  }
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: 'read' });
  } catch (e) {
    return;   // 用户取消，不报错
  }
  const inp = document.getElementById('dirPath');
  if (inp) inp.value = handle.name;
  setOut('<div class="small muted">' + pick('正在采集…','Scanning…') + '</div>');
  try {
    const r = await scanDirectory(handle);
    setOut(scanReportHTML(r));
  } catch (e) {
    setOut('<div class="small" style="color:#b45309">' + escHtml(String(e && e.message || e)) + '</div>');
  }
}


function projectBlock(p) {
  const trimSlash = (x) => { let t = String(x || ''); while (t.length > 1 && t.endsWith('/')) t = t.slice(0, -1); return t; };
  const sameAsDir = Boolean(p.statsDir && p.ws && trimSlash(p.statsDir) === trimSlash(p.ws));
  const wsTag = (p.ws && !sameAsDir) ? '<span class="wstag" title="' + escHtml(p.ws) + '">'
    + pick('记录在','records in') + ' <span class="data">' + escHtml(p.wsLabel || '') + '</span></span>' : '';
  return '<div class="flex" style="margin-bottom:6px"><b style="font-size:15px">' + escHtml(p.pid) + '</b>'
    + '<span class="muted small">' + escHtml(p.project.nameEn || '') + '</span>' + wsTag + '</div>'
    + projectCard(p) + versionTree(p) + axisMatrix(p) + heatAndTrend(p) + changeList(p) + deltaDetail(p) + evidenceView(p);
}
const PROJ_HTML = { zh: {}, en: {} };
for (const __lg of ['zh', 'en']) {
  LANG = __lg;
  for (const __p of DATA.projects) PROJ_HTML[__lg][__p.pid] = projectBlock(__p);
}


function renderAll(lang) {
  LANG = lang;
  const st = { open: ALL_PIDS.slice(), active: ALL_PIDS[0] || null, known: ALL_PIDS.slice() };
  return tabBarHTML(st) + ALL_PIDS.map((pid) => PROJ_HTML[lang][pid]).join('');
}
const HTML_ZH = renderAll('zh');
const HTML_EN = renderAll('en');
globalThis.HTML_ZH = HTML_ZH;
globalThis.HTML_EN = HTML_EN;
globalThis.renderView = renderView;      // 供测试/自动化直接驱动
globalThis.__tabs = () => TABS;          // 只读快照，便于断言
globalThis.ADD_TAB = ADD_TAB;

globalThis.__setActive = (x) => { TABS = activate(TABS, x); savePref(TABS); renderView(); };
globalThis.__lang = () => LANG;          // 当前渲染语言（pick() 的依据），便于断言"栏与正文同语言"
function applyLang() { renderView(); }
applyLang();

</script>
